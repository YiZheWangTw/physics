<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空氣阻力 - 速率關係圖</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Noto Sans TC', sans-serif;
            background-color: #f4f6f9;
            color: #222;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 22px;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            border-bottom: 1px solid #e5e9f0;
            padding-bottom: 14px;
        }
        h1 {
            font-size: clamp(1.35rem, 2.6vw, 1.8rem);
            margin: 0;
            color: #1a2b4c;
        }
        .readout-bar {
            background: #eef3fa;
            border: 1px solid #cfe0f5;
            color: #16325c;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: 600;
            min-height: 42px;
            display: flex;
            align-items: center;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px 18px;
            margin-bottom: 14px;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            font-size: 1.05rem;
            font-weight: 500;
        }
        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.15s;
        }
        .legend-item:hover {
            background: #f0f4f8;
        }
        .legend-item.muted {
            opacity: 0.4;
        }
        .swatch {
            width: 18px;
            height: 5px;
            border-radius: 2px;
            display: inline-block;
        }
        .y-zoom-controls {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            font-size: 0.96rem;
        }
        .y-zoom-label {
            font-weight: 600;
            color: #334155;
            margin-right: 2px;
        }
        .zoom-btn {
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            padding: 5px 11px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .zoom-btn:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .zoom-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .y-range-badge {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            padding: 5px 9px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
            height: clamp(340px, 56vh, 540px);
            background: #fcfdff;
            border: 1px solid #dce3ec;
            border-radius: 8px;
            overflow: hidden;
            touch-action: none;
        }
        #dragChart {
            width: 100%;
            height: 100%;
            display: block;
        }
        .hint {
            margin-top: 12px;
            font-size: 0.95rem;
            color: #667085;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>空氣阻力 - 速率關係圖</h1>
            <div class="readout-bar" id="readoutBar">移動游標或觸控圖表以讀取 x (速率) 與 y (空氣阻力) 數值</div>
        </div>

        <div class="toolbar">
            <div class="legend" id="legend"></div>
            <div class="y-zoom-controls">
                <span class="y-zoom-label">縱軸刻度：</span>
                <button type="button" class="zoom-btn" id="zoomInY" title="縮小縱軸上限，放大波形細節">放大 (+)</button>
                <button type="button" class="zoom-btn" id="zoomOutY" title="擴大縱軸上限，縮小波形比例">縮小 (-)</button>
                <button type="button" class="zoom-btn" id="resetY">重設</button>
                <span class="y-range-badge" id="yRangeBadge">0 ~ 12,000 N</span>
            </div>
        </div>

        <div class="chart-wrapper" id="chartWrapper">
            <canvas id="dragChart"></canvas>
        </div>

        <div class="hint">提示：可使用上方「放大 / 縮小」調整縱軸刻度範圍；在圖表上移動游標（或於手機上滑動）可由右上角讀取 x 與 y 數值；點擊壓力標籤可切換曲線顯示。</div>
    </div>

    <script>
        const speeds = [50, 100, 150, 200, 250, 300, 350];

        const seriesData = [
            { label: '101.325 Pa', color: '#2563eb', values: [6, 120, 196, 461, 922, 974, 1100], visible: true },
            { label: '250 Pa',     color: '#0d9488', values: [101, 120, 461, 1031, 1961, 2302, 2663], visible: true },
            { label: '500 Pa',     color: '#d97706', values: [101, 272, 784, 2131, 3915, 5016, 6079], visible: true },
            { label: '750 Pa',     color: '#dc2626', values: [158, 400, 1353, 3194, 5775, 7350, 8888], visible: true },
            { label: '1013.25 Pa', color: '#7c3aed', values: [158, 670, 1752, 4409, 7673, 10026, 11469], visible: true }
        ];

        const yMaxPresets = [500, 1000, 2000, 4000, 6000, 12000, 20000];
        let yPresetIndex = 5; // 預設 12,000 N

        const canvas = document.getElementById('dragChart');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('chartWrapper');
        const readoutBar = document.getElementById('readoutBar');
        const legendEl = document.getElementById('legend');
        const zoomInBtn = document.getElementById('zoomInY');
        const zoomOutBtn = document.getElementById('zoomOutY');
        const resetYBtn = document.getElementById('resetY');
        const yRangeBadge = document.getElementById('yRangeBadge');

        let width = 0;
        let height = 0;
        let pointerPos = null;

        const xMin = 0;
        const xMax = 370;
        const yMin = 0;

        function getYMax() {
            return yMaxPresets[yPresetIndex];
        }

        function getYTicks(yMax) {
            const targetSteps = 6;
            const rawStep = yMax / targetSteps;
            const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
            const residual = rawStep / magnitude;
            let niceStep;
            if (residual <= 1) niceStep = 1 * magnitude;
            else if (residual <= 2) niceStep = 2 * magnitude;
            else if (residual <= 2.5) niceStep = 2.5 * magnitude;
            else if (residual <= 5) niceStep = 5 * magnitude;
            else niceStep = 10 * magnitude;

            const ticks = [];
            for (let v = 0; v <= yMax + niceStep * 0.001; v += niceStep) {
                const rounded = Math.round(v);
                if (rounded <= yMax) ticks.push(rounded);
            }
            if (ticks[ticks.length - 1] !== yMax) {
                ticks.push(yMax);
            }
            return ticks;
        }

        function updateYControls() {
            const yMax = getYMax();
            yRangeBadge.textContent = `0 ~ ${yMax.toLocaleString()} N`;
            zoomInBtn.disabled = yPresetIndex <= 0;
            zoomOutBtn.disabled = yPresetIndex >= yMaxPresets.length - 1;
        }

        zoomInBtn.addEventListener('click', () => {
            if (yPresetIndex > 0) {
                yPresetIndex--;
                updateYControls();
                drawChart();
                if (pointerPos) updateHover(pointerPos.x, pointerPos.y);
            }
        });

        zoomOutBtn.addEventListener('click', () => {
            if (yPresetIndex < yMaxPresets.length - 1) {
                yPresetIndex++;
                updateYControls();
                drawChart();
                if (pointerPos) updateHover(pointerPos.x, pointerPos.y);
            }
        });

        resetYBtn.addEventListener('click', () => {
            yPresetIndex = 5;
            updateYControls();
            drawChart();
            if (pointerPos) updateHover(pointerPos.x, pointerPos.y);
        });

        function buildLegend() {
            legendEl.innerHTML = '';
            seriesData.forEach((s) => {
                const item = document.createElement('div');
                item.className = 'legend-item' + (s.visible ? '' : ' muted');
                item.innerHTML = `<span class="swatch" style="background:${s.color}"></span><span>${s.label}</span>`;
                item.addEventListener('click', () => {
                    s.visible = !s.visible;
                    buildLegend();
                    drawChart();
                    if (pointerPos) updateHover(pointerPos.x, pointerPos.y);
                });
                legendEl.appendChild(item);
            });
        }

        function getPadding() {
            const isSmall = width < 520;
            return {
                top: 28,
                right: isSmall ? 20 : 32,
                bottom: isSmall ? 62 : 70,
                left: isSmall ? 74 : 96
            };
        }

        function resizeCanvas() {
            const rect = wrapper.getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            drawChart();
            if (pointerPos) updateHover(pointerPos.x, pointerPos.y);
        }

        function xToPx(xVal, pad) {
            const plotW = width - pad.left - pad.right;
            return pad.left + ((xVal - xMin) / (xMax - xMin)) * plotW;
        }

        function yToPx(yVal, pad, yMax) {
            const plotH = height - pad.top - pad.bottom;
            return pad.top + plotH - ((yVal - yMin) / (yMax - yMin)) * plotH;
        }

        function pxToX(px, pad) {
            const plotW = width - pad.left - pad.right;
            return xMin + ((px - pad.left) / plotW) * (xMax - xMin);
        }

        function pxToY(py, pad, yMax) {
            const plotH = height - pad.top - pad.bottom;
            return yMin + ((pad.top + plotH - py) / plotH) * (yMax - yMin);
        }

        function drawChart(hoverInfo = null) {
            ctx.clearRect(0, 0, width, height);
            const pad = getPadding();
            const plotW = width - pad.left - pad.right;
            const plotH = height - pad.top - pad.bottom;
            if (plotW <= 20 || plotH <= 20) return;

            const yMax = getYMax();
            const isSmall = width < 520;
            const tickFont = isSmall ? '14px sans-serif' : '16px sans-serif';
            const labelFont = isSmall ? 'bold 16px sans-serif' : 'bold 18px sans-serif';

            // 水平網格線與 Y 軸刻度
            const yTicks = getYTicks(yMax);
            ctx.font = tickFont;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';

            yTicks.forEach(val => {
                const py = yToPx(val, pad, yMax);
                ctx.strokeStyle = val === 0 ? '#94a3b8' : '#e2e8f0';
                ctx.lineWidth = val === 0 ? 1.5 : 1;
                ctx.beginPath();
                ctx.moveTo(pad.left, py);
                ctx.lineTo(pad.left + plotW, py);
                ctx.stroke();

                ctx.fillStyle = '#334155';
                ctx.fillText(val.toLocaleString(), pad.left - 10, py);
            });

            // 垂直網格線與 X 軸刻度
            const xTicks = [0, 50, 100, 150, 200, 250, 300, 350];
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';

            xTicks.forEach(val => {
                const px = xToPx(val, pad);
                ctx.strokeStyle = val === 0 ? '#94a3b8' : '#e2e8f0';
                ctx.lineWidth = val === 0 ? 1.5 : 1;
                ctx.beginPath();
                ctx.moveTo(px, pad.top);
                ctx.lineTo(px, pad.top + plotH);
                ctx.stroke();

                ctx.fillStyle = '#334155';
                ctx.fillText(val.toString(), px, pad.top + plotH + 10);
            });

            // X 軸標題
            ctx.fillStyle = '#1e293b';
            ctx.font = labelFont;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('速率 Speed (m/s)', pad.left + plotW / 2, height - 8);

            // Y 軸標題
            ctx.save();
            ctx.translate(14, pad.top + plotH / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('空氣阻力 Drag Force (N)', 0, 0);
            ctx.restore();

            // 裁切至繪圖區內，避免放大縱軸時線條超出座標框
            ctx.save();
            ctx.beginPath();
            ctx.rect(pad.left, pad.top, plotW, plotH);
            ctx.clip();

            // 繪製各氣壓曲線與數據點
            seriesData.forEach(s => {
                if (!s.visible) return;

                ctx.strokeStyle = s.color;
                ctx.lineWidth = 2.6;
                ctx.beginPath();
                speeds.forEach((sp, i) => {
                    const px = xToPx(sp, pad);
                    const py = yToPx(s.values[i], pad, yMax);
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                });
                ctx.stroke();

                speeds.forEach((sp, i) => {
                    const px = xToPx(sp, pad);
                    const py = yToPx(s.values[i], pad, yMax);
                    ctx.fillStyle = '#ffffff';
                    ctx.strokeStyle = s.color;
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.arc(px, py, isSmall ? 4 : 4.6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                });
            });

            // 繪製游標十字準線與焦點圓點
            if (hoverInfo && hoverInfo.inside) {
                const { px, py, snapX, items } = hoverInfo;
                const guideX = snapX !== null ? snapX : px;

                ctx.save();
                ctx.setLineDash([5, 4]);
                ctx.strokeStyle = 'rgba(30, 41, 59, 0.55)';
                ctx.lineWidth = 1.4;

                ctx.beginPath();
                ctx.moveTo(guideX, pad.top);
                ctx.lineTo(guideX, pad.top + plotH);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(pad.left, py);
                ctx.lineTo(pad.left + plotW, py);
                ctx.stroke();
                ctx.restore();

                items.forEach(it => {
                    if (it.dotY >= pad.top && it.dotY <= pad.top + plotH) {
                        ctx.fillStyle = it.color;
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(it.dotX, it.dotY, 6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    }
                });
            }

            ctx.restore();
        }

        function interpolateY(sp, values) {
            if (sp <= speeds[0]) return values[0];
            if (sp >= speeds[speeds.length - 1]) return values[values.length - 1];
            for (let i = 0; i < speeds.length - 1; i++) {
                if (sp >= speeds[i] && sp <= speeds[i + 1]) {
                    const t = (sp - speeds[i]) / (speeds[i + 1] - speeds[i]);
                    return values[i] + t * (values[i + 1] - values[i]);
                }
            }
            return values[0];
        }

        function updateHover(clientX, clientY) {
            const rect = wrapper.getBoundingClientRect();
            const px = clientX - rect.left;
            const py = clientY - rect.top;
            pointerPos = { x: clientX, y: clientY };

            const pad = getPadding();
            const plotW = width - pad.left - pad.right;
            const plotH = height - pad.top - pad.bottom;
            const yMax = getYMax();

            const inside = px >= pad.left && px <= pad.left + plotW && py >= pad.top && py <= pad.top + plotH;
            if (!inside) {
                readoutBar.textContent = '移動游標或觸控圖表以讀取 x (速率) 與 y (空氣阻力) 數值';
                drawChart(null);
                return;
            }

            const rawX = pxToX(px, pad);
            const rawY = pxToY(py, pad, yMax);

            let snappedSpeed = null;
            let snapX = null;
            for (const sp of speeds) {
                const spPx = xToPx(sp, pad);
                if (Math.abs(px - spPx) <= 12) {
                    snappedSpeed = sp;
                    snapX = spPx;
                    break;
                }
            }

            const activeX = snappedSpeed !== null ? snappedSpeed : rawX;
            const items = seriesData.filter(s => s.visible).map((s) => {
                let yVal;
                if (snappedSpeed !== null) {
                    const sIdx = speeds.indexOf(snappedSpeed);
                    yVal = s.values[sIdx];
                } else {
                    yVal = interpolateY(rawX, s.values);
                }
                return {
                    color: s.color,
                    dotX: xToPx(activeX, pad),
                    dotY: yToPx(yVal, pad, yMax)
                };
            });

            const xText = snappedSpeed !== null ? `${snappedSpeed} m/s` : `${rawX.toFixed(1)} m/s`;
            const yCursorText = `${Math.round(rawY).toLocaleString()} N`;
            readoutBar.textContent = `游標位置 — x (速率): ${xText} ｜ y (空氣阻力): ${yCursorText}`;

            drawChart({ inside: true, px, py, snapX, items });
        }

        wrapper.addEventListener('mousemove', (e) => updateHover(e.clientX, e.clientY));
        wrapper.addEventListener('mouseleave', () => {
            pointerPos = null;
            readoutBar.textContent = '移動游標或觸控圖表以讀取 x (速率) 與 y (空氣阻力) 數值';
            drawChart(null);
        });

        wrapper.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                updateHover(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        wrapper.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updateHover(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('resize', resizeCanvas);

        buildLegend();
        updateYControls();
        resizeCanvas();
    </script>
</body>
</html>
